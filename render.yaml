# ====================================================================
# Render Blueprint Specification for ReportSaathi Backend
# Deploy via: Render Dashboard -> Blueprints -> Connect Repository
# ====================================================================

services:
  - type: web
    name: reportsaathi-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon # or frankfurt, singapore
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://reportsaathi.pages.dev,http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false
